[package]
name = "ai-commit"
version = "0.1.1"
edition = "2021"
description = "Generate a Conventional Commits message for staged changes"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
indicatif = "0.18.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
